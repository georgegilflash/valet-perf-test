services:
  postgres:
    image: postgres:16-alpine
    container_name: valet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valet_password}
      POSTGRES_DB: ${POSTGRES_DB:-valet_db}
    volumes:
      - valet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valet} -d ${POSTGRES_DB:-valet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  valet_pgdata:
